<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sir Huggington's Internet</title>
<style>
  :root {
    --sky-top: #87ceeb;
    --sky-bottom: #e0f7ff;
    --deep-blue: #0a3d62;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(to bottom, var(--sky-top), var(--sky-bottom));
    color: var(--deep-blue);
    overflow-x: hidden;
  }

  .sun {
    position: fixed;
    top: 45px;
    right: 70px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,255,255,0.95) 0%,
      rgba(255,255,255,0.45) 30%,
      rgba(255,255,255,0.05) 68%,
      transparent 72%);
    filter: blur(2px);
    pointer-events: none;
  }

  .bubble {
    position: fixed;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%,
      rgba(255,255,255,0.92),
      rgba(255,255,255,0.18));
    box-shadow: inset 0 0 20px rgba(255,255,255,0.8),
                0 0 30px rgba(255,255,255,0.25);
    animation: float 12s infinite ease-in-out;
    pointer-events: none;
  }

  .b1 { width:110px; height:110px; top:70px; left:40px; }
  .b2 { width:180px; height:180px; top:220px; right:80px; animation-delay:2s; }
  .b3 { width:70px; height:70px; bottom:180px; left:15%; animation-delay:4s; }
  .b4 { width:120px; height:120px; bottom:80px; right:18%; animation-delay:6s; }

  @keyframes float {
    0%   { transform: translateY(0) translateX(0); }
    50%  { transform: translateY(-24px) translateX(8px); }
    100% { transform: translateY(0) translateX(0); }
  }

  .wrap {
    position: relative;
    z-index: 2;
    width: min(760px, calc(100% - 32px));
    margin: 0 auto;
    padding: 70px 0 110px;
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
  }

  .header h1 {
    margin: 0;
    font-size: clamp(34px, 6vw, 58px);
    color: var(--deep-blue);
    text-shadow: 0 2px 0 rgba(255,255,255,0.85);
  }

  .header p {
    margin: 10px 0 0;
    font-size: 18px;
    color: #1e5f8a;
  }

  .links {
    display: grid;
    gap: 18px;
  }

  .link-card {
    display: block;
    text-decoration: none;
    color: var(--deep-blue);
    background: linear-gradient(to bottom,
      rgba(255,255,255,0.92),
      rgba(255,255,255,0.62));
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 28px;
    padding: 22px 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.16),
                inset 0 0 20px rgba(255,255,255,0.45);
    backdrop-filter: blur(12px);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .link-card:hover {
    transform: translateY(-5px) scale(1.01);
    box-shadow: 0 18px 40px rgba(0,0,0,0.21);
  }

  .icon {
    font-size: 32px;
    margin-right: 10px;
    vertical-align: middle;
  }

  .title {
    font-size: 26px;
    font-weight: bold;
    vertical-align: middle;
  }

  .desc {
    margin-top: 9px;
    color: #123a52;
    font-size: 16px;
    line-height: 1.45;
  }

  .footer {
    text-align: center;
    margin-top: 28px;
    color: #1e5f8a;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="sun"></div>
  <div class="bubble b1"></div>
  <div class="bubble b2"></div>
  <div class="bubble b3"></div>
  <div class="bubble b4"></div>

  <main class="wrap">
    <header class="header">
      <h1>🐷 Sir Huggington's Internet</h1>
      <p>Two websites. One unnecessarily elaborate portal.</p>
    </header>

    <section class="links">
      <a class="link-card"
         href="https://sirhuggington.github.io/bostadsapokalypsen/"
         target="_blank" rel="noopener noreferrer">
        <div>
          <span class="icon">🏠</span>
          <span class="title">Bostadsapokalypsen</span>
        </div>
        <div class="desc">
          Sanningsbaserad satir om köer, hyror, bostadsbrist och den svenska bostadsapokalypsen.
        </div>
      </a>

      <a class="link-card"
         href="https://sirhuggington.github.io/leettest/skeppatva/index.html"
         target="_blank" rel="noopener noreferrer">
        <div>
          <span class="icon"></span>
          <span class="title">🔥 Burning Laptop Studios 🔥</span>
        </div>
        <div class="desc">
          My Proto-Game Showcase
        </div>
      </a>
    </section>

    <div class="footer">© 2026 Sir Huggington</div>
  </main>
</body>
</html>
